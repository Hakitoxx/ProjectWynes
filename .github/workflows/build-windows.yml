name: Test & Build (Windows)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"  # matches the verified development runtime
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run test suite
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v 2>&1 | Tee-Object -FilePath test.log
          $code = $LASTEXITCODE
          # surface failing test names AND their final error line as
          # annotations (visible on the public run page)
          $lines = Get-Content test.log
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^(FAIL|ERROR): (.+?)( \(|$)") {
              $name = $Matches[2]
              $detail = ""
              for ($j = $i + 1; $j -lt $lines.Count -and $lines[$j] -notmatch "^-{10,}$"; $j++) {
                if ($lines[$j].Trim()) { $detail = $lines[$j].Trim() }
              }
              $detail = $detail -replace "[:%\r\n\[\]]", " "
              Write-Output ("::error title=Test failure::{0}  [{1}]" -f $name, $detail)
            }
          }
          exit $code

  build:
    name: Build executable (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write # required to attach the artifact to the release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"  # matches the verified development runtime
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Build executable
        run: python -m PyInstaller --noconfirm packaging\projectwynes.spec
      - name: Package artifact
        shell: pwsh
        run: |
          Compress-Archive -Path dist\projectwynes.exe -DestinationPath projectwynes-windows.zip -Force
          (Get-FileHash projectwynes-windows.zip -Algorithm SHA256).Hash.ToLower() + "  projectwynes-windows.zip" |
            Set-Content -Encoding ASCII projectwynes-windows.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: projectwynes-windows
          path: |
            projectwynes-windows.zip
            projectwynes-windows.zip.sha256
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            projectwynes-windows.zip
            projectwynes-windows.zip.sha256
